name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Compilar
        run: |
          echo "Arquivos no repositorio:"
          ls -la
          BUILD_FILE=$(find . -name build.gradle -not -path './.git/*' | head -n1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERRO: nao achei o build.gradle. Os arquivos do projeto nao foram enviados ao GitHub."
            exit 1
          fi
          cd "$(dirname "$BUILD_FILE")"
          echo "Projeto encontrado em: $(pwd)"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          else
            echo "gradlew nao encontrado, usando Gradle instalado"
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-9.7.1/bin/gradle build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: noite-de-defesa-mod
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
